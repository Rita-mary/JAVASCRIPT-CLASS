<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess game</title>
    <link rel="stylesheet" href="style.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <div class="parent">
        <div class="intro">
            <h2>Random Number Guess Game</h2>
            <p>This game allows you to guess the random number (1-20) generated by the computer.</p>
        </div>
        <p id="ph">Enter your guess</p>
        <div class="num-cont">
            <input type="text" maxlength="1" class="num-box">
            <input type="text" maxlength="1" class="num-box">
        </div>
        
        <div id="sticker">😐</div>
        
        <input type="hidden" id="final-value">
        <button id="checkbtn">Check</button>
        <p id="feedback"></p>
    </div>
</body>
</html>
