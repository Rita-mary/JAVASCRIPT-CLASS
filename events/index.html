<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM</title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <form id="formInput">
      <h1>Create an account</h1>
      <input type="text" placeholder="Enter your Name" id="nameInput" /><br />
      <input
        type="date"
        placeholder="Enter your date of birth"
        id="dateInput"
      /><br />
      <input
        type="number"
        placeholder="Enter your Phone Number"
        id="numberInput"
      /><br />
      <button type="button">Click Me</button>
      <button type="submit" id="sendBtn">Send Details</button>
    </form>
  </body>
</html>
